<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100a2e">
<meta name="description" content="Play Lowball on INSERT COIN. Guess the price of everyday items.">
<title>Lowball — INSERT COIN</title>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../game-flow.css">
<style>
.lowball-main{position:relative;z-index:30;padding:8px 0 20px;min-height:calc(100vh - 110px);background:#100a2e}
.lowball-shell{width:100%;max-width:none;margin:0 auto}
.lowball-frame{display:block;width:100%;height:1180px;border:0;background:#100a2e;box-shadow:none;overflow:hidden}
@media(max-width:600px){.lowball-main{padding:2px 0 12px}.lowball-frame{height:1420px}}
</style>
</head>
<body>
<header class="site-header game-site-header"><div class="wrap game-header-inner">
<button class="game-menu-toggle" id="game-menu-toggle" type="button" aria-expanded="false" aria-controls="game-menu"><span class="hamburger-lines" aria-hidden="true">☰</span><span class="menu-toggle-label">MENU</span></button>
<a class="brand" href="../../index.html" aria-label="INSERT COIN — back to all games"><img src="../../assets/logo.svg" alt=""><span class="brand-name">INSERT <span>COIN</span></span></a>
<a class="game-header-account" href="../../login.html">ACCOUNT</a></div>
<nav class="game-menu" id="game-menu" aria-label="INSERT COIN menu" aria-hidden="true" hidden><div class="game-menu-heading"><span class="section-meta">INSERT COIN MENU</span><button class="game-menu-close" id="game-menu-close" type="button" aria-label="Close menu">×</button></div><div class="game-menu-content"><div class="game-menu-group"><span class="section-meta">PLAY MORE</span><a href="../stake/index.html">Stake</a><a href="../../index.html#daily-games">All games</a><a href="index.html">Lowball</a><a href="../pixel-pairs/index.html">Pixel Pairs</a><a href="../word-forge/index.html">Word Forge</a><a href="../gridlock/index.html">Gridlock</a><a href="../number-drop/index.html">Number Drop</a><a href="../memory-lane/index.html">Memory Lane</a></div><div class="game-menu-group"><span class="section-meta">YOUR ARCADE</span><a href="../../profile.html">My stats</a><a href="../../friends.html">Friends</a><a href="../../login.html">Account / sign in</a></div></div></nav></header>
<main class="lowball-main"><div class="lowball-shell">
<iframe class="lowball-frame" id="lowball-game-frame" src="engine/index.html" title="Lowball price guessing game" loading="eager"></iframe>
</div></main>
<footer class="site-footer standalone-site-footer"><div class="wrap footer-inner"><span>© 2026 INSERT COIN · ONE DAY. ONE RUN.</span><div class="footer-links"><a href="../../index.html">All games</a><a href="../../profile.html">My stats</a></div></div></footer>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const button=document.getElementById("game-menu-toggle"),menu=document.getElementById("game-menu"),close=document.getElementById("game-menu-close");
 if(!button||!menu)return;
 const backdrop=document.createElement("div");backdrop.className="game-menu-backdrop";backdrop.hidden=true;backdrop.setAttribute("aria-hidden","true");document.body.appendChild(backdrop);
 const openMenu=()=>{menu.hidden=false;backdrop.hidden=false;menu.setAttribute("aria-hidden","false");button.setAttribute("aria-expanded","true");document.body.classList.add("game-menu-open");if(close)close.focus();};
 const closeMenu=({restoreFocus=false}={})=>{menu.hidden=true;backdrop.hidden=true;menu.setAttribute("aria-hidden","true");button.setAttribute("aria-expanded","false");document.body.classList.remove("game-menu-open");if(restoreFocus)button.focus();};
 button.addEventListener("click",()=>button.getAttribute("aria-expanded")==="true"?closeMenu():openMenu());
 if(close)close.addEventListener("click",()=>closeMenu({restoreFocus:true}));
 backdrop.addEventListener("click",()=>closeMenu({restoreFocus:true}));
 menu.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>closeMenu()));
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!menu.hidden)closeMenu({restoreFocus:true});});
});
</script></body></html>
