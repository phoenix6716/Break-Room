name: Check private weekly leagues
on:
  push:
    branches: [private-weekly-leagues]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCADE_DIFF_BASE: a3d8739b43a1e24dc8bad89f4ce005e571322bc5
      ARCADE_DIFF_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Focused league and integration checks
        run: |
          export ARCADE_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          npm test -- --files leagues.css tests/leagues.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: league-check-logs
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
