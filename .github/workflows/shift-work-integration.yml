name: Check Shift Work integration
on:
  push:
    branches: [integrate-shift-work]
permissions:
  contents: read
concurrency:
  group: shift-work-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shift-work:
    name: Shift Work rules, SQL and production UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Select affected release checks
        env:
          ARCADE_DIFF_BASE: 8936f62ed90537d6dee66235001faa1b56b88513
          ARCADE_DIFF_HEAD: ${{ github.sha }}
        run: node scripts/affected-checks.cjs --plan
      - name: Run affected release checks
        env:
          ARCADE_DIFF_BASE: 8936f62ed90537d6dee66235001faa1b56b88513
          ARCADE_DIFF_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          export ARCADE_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          mkdir -p .artifacts
          npm test 2>&1 | tee .artifacts/shift-work-release-check.log
      - name: Keep focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-work-evidence
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
