name: Check Hidden Gem integration
on:
  push:
    branches: [integrate-hidden-gem]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hidden-gem-integration
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Hidden Gem model and isolated database helpers
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          node tests/hidden-gem-rules.cjs 2>&1 | tee .artifacts/hidden-gem-rules.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidden-gem-checks
          path: .artifacts/
          retention-days: 7
