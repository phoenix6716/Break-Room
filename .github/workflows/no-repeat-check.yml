name: Check no-repeat Daily integration
on:
  push:
    branches: [no-repeat-dailies]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCADE_DIFF_BASE: d072719ba2bcc512c3d02eefe5d098af05a105a3
      ARCADE_DIFF_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Verify authoring output stays reproducible
        run: |
          node scripts/build-lowball-additions.cjs
          git diff --exit-code
      - name: Check the complete affected change against a project-path build
        shell: bash
        run: |
          export ARCADE_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          mkdir -p .artifacts
          npm test 2>&1 | tee .artifacts/full-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-repeat-integration-checks
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
