name: Prepare no-repeat Daily artwork
on:
  push:
    branches: [no-repeat-dailies]
    paths:
      - games/lowball/engine/icons/generated/source/items-5.png
      - scripts/extract-lowball-additions.cjs
      - .github/workflows/no-repeat-art.yml
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned extraction dependency outside the repository
        run: npm install --prefix /tmp/lowball-art-tools --ignore-scripts --no-audit --no-fund --package-lock=false sharp@0.34.5
      - name: Extract generated atlas without redrawing
        env:
          NODE_PATH: /tmp/lowball-art-tools/node_modules
        run: node scripts/extract-lowball-additions.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: lowball-new-art
          path: .artifacts/lowball-new-art/
          retention-days: 7
