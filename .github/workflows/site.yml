name: Check and publish Break Room

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete suite for an explicitly requested audit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # New PR commits supersede old checks; main publishes remain sequential.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test the production site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCADE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      ARCADE_DIFF_HEAD: ${{ github.sha }}
      ARCADE_FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select checks for changed files
        id: scope
        run: node scripts/affected-checks.cjs --plan
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.python == 'true'
        with:
          python-version: '3.12'
      - name: Install matching Chromium
        if: steps.scope.outputs.browser == 'true'
        # Ubuntu runners include Chrome and its system libraries; avoid a redundant apt upgrade.
        run: npx playwright install chromium
      - name: Run selected checks against a project-path build
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          export ARCADE_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          mkdir -p .artifacts
          npm test 2>&1 | tee .artifacts/full-check.log
      - name: Keep check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
      - name: Upload the checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null; then
            echo "::error::Enable GitHub Pages in repository Settings > Pages > Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Publish the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Hidden Gem and shared clients
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, pathlib, time, urllib.request
          base = os.environ["PUBLISHED_URL"].rstrip("/") + "/"
          paths = ["index.html", "games/hidden-gem/index.html", "games/hidden-gem/questions.js", "games/hidden-gem/hidden-gem.js", "games/hidden-gem/hidden-gem.css", "hidden-gem-model.js", "cloud-saves.js", "accounts.js", "friends.js", "profile-records.js", "profile.js", "navigation.js", "game-config.js"]
          for attempt in range(6):
              try:
                  for path in paths:
                      request = urllib.request.Request(base + path + "?release=" + os.environ["GITHUB_SHA"], headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                      if path == "index.html":
                          assert b"9 DAILY GAMES" in body and b"games/hidden-gem/index.html" in body and b"games/stake/index.html" not in body, path
                      elif path.endswith(".html"):
                          assert b"<title>Hidden Gem" in body and b'hidden-gem.js' in body, path
                      else:
                          assert body == pathlib.Path(path).read_bytes(), "Published file differs: " + path
                  print("Verified live Hidden Gem, shelf and shared account/profile/Friends files:", base, os.environ["GITHUB_SHA"])
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(2)
          PY
