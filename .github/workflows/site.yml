name: Check and publish Break Room

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test the production site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all checks against a project-path build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          export ARCADE_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          npm test
      - name: Keep check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .artifacts/
          retention-days: 7
      - name: Upload the checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null; then
            echo "::error::Enable GitHub Pages in repository Settings > Pages > Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Publish the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
