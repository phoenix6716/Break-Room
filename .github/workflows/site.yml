name: Check and publish Break Room

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete suite for an explicitly requested audit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # New PR commits supersede old checks; main publishes remain sequential.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test the production site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCADE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      ARCADE_DIFF_HEAD: ${{ github.sha }}
      ARCADE_FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select checks for changed files
        id: scope
        run: node scripts/affected-checks.cjs --plan
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.python == 'true'
        with:
          python-version: '3.12'
      - name: Install matching Chromium
        if: steps.scope.outputs.browser == 'true'
        # Ubuntu runners include Chrome and its system libraries; avoid a redundant apt upgrade.
        run: npx playwright install chromium
      - name: Run selected checks against a project-path build
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          export ARCADE_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          mkdir -p .artifacts
          npm test 2>&1 | tee .artifacts/full-check.log
      - name: Keep check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
      - name: Upload the checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null; then
            echo "::error::Enable GitHub Pages in repository Settings > Pages > Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Publish the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published games and shared clients
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, pathlib, time, urllib.request
          base = os.environ["PUBLISHED_URL"].rstrip("/") + "/"
          paths = ["games/stack-up/familiar-stacks.js", "games/stack-up/stack-up.js", "games/time-drop/events.js", "games/clue-ladder/puzzles.js", "brand.css", "menu-brand.css", "assets/break-room-wordmark.png", "assets/break-room-mark.png", "assets/break-room-icon.svg", "assets/break-room-touch-icon.png", "assets/favicon.svg", "assets/logo.svg", "leagues.html", "leagues.js", "leagues-model.js", "leagues.css", "inner-clock-model.js", "arcade-score.js", "games/lowball/engine/index.html", "games/lowball/engine/reference-prices.js", "games/lowball/engine/item-art.js", "games/inner-clock/index.html", "games/inner-clock/inner-clock.js", "profile.html", "friends.html", "index.html", "games/shift-work/index.html", "games/shift-work/boards.js", "games/shift-work/shift-work.js", "games/shift-work/shift-work.css", "shift-work-model.js", "games/hidden-gem/index.html", "games/hidden-gem/questions.js", "games/hidden-gem/hidden-gem.js", "games/hidden-gem/hidden-gem.css", "hidden-gem-model.js", "cloud-saves.js", "accounts.js", "friends.js", "profile-records.js", "profile.js", "navigation.js", "game-config.js", "game-scenes.js", "game-scenes.css"]
          import json
          manifest = json.loads(pathlib.Path("games/lowball/engine/icons/generated/manifest.json").read_text())
          paths += ["games/lowball/engine/icons/generated/" + entry["file"] for entry in manifest["items"].values() if entry.get("source") == "items-5.png" or entry.get("logoReview")]
          paths += ["games/lowball/engine/icons/" + entry["file"] for entry in manifest["items"].values() if entry.get("logoReview") and pathlib.Path("games/lowball/engine/icons/" + entry["file"]).exists()]
          for attempt in range(6):
              try:
                  for path in paths:
                      request = urllib.request.Request(base + path + "?release=" + os.environ["GITHUB_SHA"], headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                      if path in ["leagues.html", "friends.html", "profile.html"]:
                          assert b"hub-topbar" in body and b"menu-brand.css?v=hub-topbar-20261027" in body, "Missing social top bar: " + path
                      if path.endswith(".html") and path != "games/lowball/engine/index.html":
                          assert b"br-brand__image" in body and b"tile05-20261025" in body, "Missing approved logo: " + path
                      if path == "index.html":
                          assert b"Desk Jam" in body and b"<h3>Shift Work</h3>" not in body and b"Sleeper" in body and b"<h3>Hidden Gem</h3>" not in body and b"Time Sense" in body and b"Inner Clock" not in body and b"10 DAILY GAMES" in body and b"games/hidden-gem/index.html" in body and b"games/shift-work/index.html" in body and b"games/stake/index.html" not in body, path
                      elif path in ["games/inner-clock/index.html", "profile.html", "friends.html"]:
                          assert b"Desk Jam" in body and b"Sleeper" in body and b"Time Sense" in body and b"Inner Clock" not in body, path
                      elif path == "games/lowball/engine/index.html":
                          assert b"DAILY_ITEM_PERIOD = 32" in body and b"DAILY_ITEM_CUTOVER = 25" in body and b"Fiskars scissors" in body, path
                      elif path == "leagues.html":
                          assert b"leagues.js" in body and b"2,100" in body and b"JOIN LEAGUE" in body, path
                      elif path.endswith(".html"):
                          assert ((b"<title>Desk Jam" in body and b"shift-work.js" in body) if "shift-work" in path else (b"<title>Sleeper" in body and b"hidden-gem.js" in body)), path
                      else:
                          assert body == pathlib.Path(path).read_bytes(), "Published file differs: " + path
                  for current in ["laser","time-drop","clue-ladder","seating-chart","shift-work","hidden-gem","stack-up","pack","inner-clock"]:
                      request = urllib.request.Request(base + "games/" + current + "/index.html?release=" + os.environ["GITHUB_SHA"], headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          page = response.read()
                      assert ('data-game-scene="' + current + '"').encode() in page and b"game-scenes.css?v=sets-20261027" in page and b"game-scenes.js?v=sets-20261027" in page, "Missing themed surface: " + current
                  print("Verified all current game sets and shared motion assets.")
                  for retired in ["stake","prior","alibi","bouncer","pixel-pairs","word-forge","gridlock","number-drop","memory-lane","mystery-cabinet"]:
                      request = urllib.request.Request(base + "games/" + retired + "/index.html?release=" + os.environ["GITHUB_SHA"], headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          redirect = response.read()
                      assert b'http-equiv="refresh"' in redirect and b'../../index.html' in redirect and b'<title>Break Room</title>' in redirect, "Retired game still public: " + retired
                  print("Verified retired game bookmarks return to the shelf.")
                  print("Verified live option05 branding, selectors, logo-free Lowball artwork, references and shared clients:", base, os.environ["GITHUB_SHA"])
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(2)
          PY
