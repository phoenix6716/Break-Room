/* name, test function, fun fact */
const RD=[
["has a double letter",has(/(.)\1/),"Bookkeeper is the only common English word with three double letters in a row."],
["has its letters in alphabetical order",w=>[...w].every((c,i)=>!i||w[i-1]<=c),"Words like almost are called abecedarian words."],
["starts and ends with the same letter",w=>first(w)==last(w),"Dad, noon and stats all start and end alike."],
["has exactly 2 vowels",w=>vc(w)==2,"Only A, E, I, O and U count here. Y can act as a vowel but is not counted."],
["is a palindrome",w=>w==[...w].reverse().join(""),"Palindrome comes from Greek words meaning running back again."],
["has exactly 5 letters",w=>w.length==5,"Five letters is the length used by many popular daily word guessing games."],
["has 4 letters or fewer",w=>w.length<=4,"Many of the most common English words are short."],

["starts with a vowel",has(/^[aeiou]/),"We say an before vowel sounds, which is why it is an hour but a university."],

["has exactly 1 vowel",w=>vc(w)==1,"Strengths packs seven consonants around a single vowel."],
["has 3 or more vowels",w=>vc(w)>=3,"Queue has five letters and four of them are vowels."],
["contains the letter E",has(/e/),"E is the most common letter in English."],
["has no letter E",w=>!/e/.test(w),"The 1939 novel Gadsby runs to about 50,000 words without using E."],
["ends in the letter S",has(/s$/),"S ends many words because of plurals."],

["starts with the letter T",has(/^t/),"T is the most common first letter in running English text, thanks to the word the."],

["ends in ING",has(/ing$/),"The ing ending often turns a verb into an ongoing action."],
["ends in ED",has(/ed$/),"Many English past tense verbs end in ed."],
["contains OU",has(/ou/),"OU is pronounced differently in tough, though, through and thought."],
["contains EA",has(/ea/),"EA sounds different in bread, beach and break."],
["contains ER",has(/er/),"Many job words end in er, like baker and teacher."],
["has no repeated letters",w=>new Set(w).size==w.length,"A word with no repeated letter is called an isogram."],
["contains both A and E",w=>/a/.test(w)&&/e/.test(w),"A and E are two of the three most common letters in English."],
["has its letters in reverse alphabetical order",w=>[...w].every((c,i)=>!i||w[i-1]>=c),"Spoon and wolf run backwards through the alphabet."],
["has more consonants than vowels",w=>w.length-vc(w)>vc(w),"English uses 21 consonant letters and only 5 vowel letters."],
["has two vowels side by side",has(/[aeiou]{2}/),"Vowel pairs like EA and OO are called digraphs when they make one sound."],
["contains the letter O",has(/o/),"O is one of the five most common letters in English."],
["contains the letter A",has(/a/),"A is one of the three most common letters in English."],
["contains the letter R",has(/r/),"R is one of the ten most common letters in English."],
["contains the letter L",has(/l/),"L doubles up in many words like ball, bell and hill."],
["contains the letter S",has(/s/),"S ends more words than most letters, thanks to plurals."],
["contains the letter T",has(/t/),"T is the second most common letter in English."],
["contains the letter U",has(/u/),"In English, Q is almost always followed by U."],
["contains the letter I",has(/i/),"The dot on the i was added in medieval times to tell it apart from nearby strokes."],
["contains the letter W",has(/w/),"W is the only letter whose name has three syllables."],
["has a first letter earlier in the alphabet than its last",w=>first(w)<last(w),"Cat goes from C to T, forward through the alphabet."],
["has a first letter later in the alphabet than its last",w=>first(w)>last(w),"Tea runs from T back to A."],
["starts with the letter C",has(/^c/),"C can sound like K or like S."],
["starts with the letter B",has(/^b/),"The B is silent in debt and doubt."],

];
const CATS=[["is a body part","body","Body parts hide inside other words, like chin in machine and ear in heart."],
["is an animal","animal","Many animal words are also verbs, like duck, seal and bear."],
["is a colour","colour","Orange was a fruit name in English before it was a colour name."],
["is a fruit or vegetable","food","Botanically a tomato is a fruit, but cooks treat it as a vegetable."],
["is something you wear","clothes","The word jeans comes from Genoa, a city in Italy."],

/* ===== SELF-CHECK AND RULES ===== */
const mk=(name,fn,fact,pass,fail)=>({name,fn,fact,pass,fail});
let RULES=[...RD.map(([n,f,t])=>mk(n,f,t,ALL.filter(f),ALL.filter(w=>!f(w)))),
 ...CATS.map(([n,k,t])=>{const s=new Set(SETS[k]),f=w=>s.has(w);return mk(n,f,t,SETS[k].filter(w=>ALL.includes(w)),ALL.filter(w=>!s.has(w)))})];
const REPORT=[];
RULES=RULES.filter(r=>{const p=r.pass.length,q=r.fail.length;
 r.pass=r.pass.filter(w=>r.fn(w));r.fail=r.fail.filter(w=>!r.fn(w));
 const bad=p-r.pass.length+q-r.fail.length,ok=r.pass.length>=20&&r.fail.length>=20;
 if(bad||!ok)REPORT.push(r.name+": removed "+bad+" mismatches, pools "+r.pass.length+"/"+r.fail.length+(ok?"":" DROPPED"));
 return ok});
/* ===== RANDOM, DATES, STORAGE ===== */
const xm=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0};
const rng=s=>{let a=xm(s);return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const shuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const p2=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const today=()=>fmt(new Date());
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d)};
const mem={};
const ST={get(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return k in mem?mem[k]:null},
 set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const jget=k=>{try{return JSON.parse(ST.get(k))}catch(e){return null}};
const jset=(k,v)=>ST.set(k,JSON.stringify(v));
/* ===== SET GENERATION ===== */
function build(A,B,r,extra){ // 4 IN and 4 OUT per rule, no word passes both rules
 const used=new Set(),out=[];
 for(const[X,Y]of[[A,B],[B,A]]){
  const ins=shuf(X.pass.filter(w=>!Y.fn(w)&&!used.has(w)),r).slice(0,4);ins.forEach(w=>used.add(w));
  const outs=shuf(X.fail.filter(w=>!used.has(w)),r).slice(0,4);outs.forEach(w=>used.add(w));
  if(ins.length<4||outs.length<4)return null;
  out.push(shuf([...ins.map(w=>({w,t:true})),...outs.map(w=>({w,t:false}))],r));
 }return out}
function makeSet(date){
 const r=rng("bouncer|"+date);
 for(let n=0;n<500;n++){
  const a=Math.floor(r()*RULES.length),b=Math.floor(r()*RULES.length);
  if(a==b)continue;
  const w=build(RULES[a],RULES[b],r);
  if(w)return[{ri:a,words:w[0]},{ri:b,words:w[1]}];
 }throw new Error("no set")}
function makeOne(ri){const r=rng("free|"+Math.random()+Date.now()),R=RULES[ri];
 const ins=shuf(R.pass,r).slice(0,4),outs=shuf(R.fail,r).slice(0,4);
 return[{ri,words:shuf([...ins.map(w=>({w,t:true})),...outs.map(w=>({w,t:false}))],r)}]}
/* ===== SCORING, SHARING, COMPARE ===== */
const scoreOf=(run,i)=>run.sets[i].words.reduce((n,x,j)=>n+(run.a[i][j]===x.t?1:0),0);
const flat=run=>run.a.flat().map(v=>v?"1":"0").join("");
const codeOf=(date,run)=>date+"-"+flat(run);
function shareText(date,run){
 const rows=run.sets.map((s,i)=>"Rule "+(i+1)+": "+s.words.map((x,j)=>run.a[i][j]===x.t?"✅":"❌").join("")+" "+scoreOf(run,i)+"/8, "+run.t[i].length+" tests");
 const tot=run.sets.reduce((n,_,i)=>n+scoreOf(run,i),0),tests=run.t.reduce((n,x)=>n+x.length,0),c=codeOf(date,run);
 return["Bouncer "+date,...rows,"Total "+tot+"/16 with "+tests+" tests","Code: "+c,SHARE_URL+"?c="+c].join("\n")}
const CODE_RE=/^(\d{4}-\d{2}-\d{2})-([01]{16})$/;
function parseCode(text){
 const m=String(text||"").match(/(\d{4}-\d{2}-\d{2}-[01]{16})(?![\d])/);
 const c=m&&m[1].match(CODE_RE);if(!c)return null;
 const d=parseD(c[1]);if(fmt(d)!==c[1])return null; // rejects 2026-02-31 and similar
 return{date:c[1],ans:c[2]}}
/* ===== STREAK AND DAILY STORAGE ===== */
const RK=d=>"bouncer.run."+d;
function streakNow(){const s=jget("bouncer.streak");if(!s||!s.last)return 0;const t=today();return(s.last==t||s.last==addDays(t,-1))?s.n|0:0}
function finishDaily(date){ // [HOOK freeze] bridge a single missed day here
 const s=jget("bouncer.streak")||{last:"",n:0};
 if(s.last==date)return;
 jset("bouncer.streak",{last:date,n:s.last==addDays(date,-1)?(s.n|0)+1:1})}
function newRun(mode,date,sets){return{mode,date,sets,ri:0,ph:"test",t:sets.map(()=>[]),a:sets.map(s=>s.words.map(()=>null))}}
function loadDaily(date){
 const run=newRun("daily",date,makeSet(date)),s=jget(RK(date));
 if(s&&Array.isArray(s.a)&&s.a.length==2&&s.a.every(x=>x.length==8)){run.t=s.t;run.a=s.a;run.ri=s.ri|0;run.ph=s.ph||"test"}
 return run}
const saveRun=run=>{if(run.mode=="daily")jset(RK(run.date),{t:run.t,a:run.a,ri:run.ri,ph:run.ph})};
const isDone=run=>run.ri>=run.sets.length;
/* ===== UI (text nodes only, user input is never parsed as HTML) ===== */
const h=(t,a,...c)=>{const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(k=="class")e.className=v;else if(k.startsWith("aria-"))e.setAttribute(k,String(v));else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}
 for(const x of c.flat())if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)));return e};
const V={tab:"daily",run:null,day:today(),stale:false,pending:null,cmp:null,free:{deck:[],pos:0,played:0,round:0},say:""};
const app=()=>document.getElementById("app");
const IN="IN ✓",OUT="OUT ✕";
function header(){
 const tab=(id,label)=>h("button",{role:"tab","aria-selected":V.tab==id,onclick:()=>{V.tab=id;if(V.run&&V.run.mode!="daily")V.run=null;if(id=="free")V.run=null;V.cmp=null;render()}},label);
 return h("header",{},
  h("div",{class:"rope","aria-hidden":"true"},h("div",{class:"post"}),h("div",{class:"cord"}),h("div",{class:"post"})),
  h("h1",{},"Bouncer"),h("p",{class:"sub"},"Guess the door rule"),
  h("nav",{role:"tablist"},tab("daily","Daily"),tab("free","Unlimited")))}
function render(){
 const m=V.tab=="free"?freeView():V.run&&!isDone(V.run)?playView():V.cmp?cmpView():homeView();
 app().replaceChildren(header(),m);
 const f=app().querySelector("[data-focus]");if(f)f.focus({preventScroll:true})}
/* --- play screens --- */
function playView(){
 const run=V.run,i=run.ri,set=run.sets[i],R=RULES[set.ri],n=run.sets.length;
 const label=run.mode=="free"?"Rule "+(V.free.played+1)+" this session":"Rule "+(i+1)+" of "+n;
 const tag=run.mode=="cmp"?" (compare run)":"";
 const top=h("div",{class:"bar"},h("span",{},label+tag),h("span",{},"Tests used: "+run.t[i].length+" of 4"));
 const note=V.stale&&run.mode=="daily"?h("p",{class:"tiny",role:"status"},"A new day has started. Finish this set, then play the new one."):null;
 let body;
 if(run.ph=="test"){
  const left=4-run.t[i].length;
  body=h("div",{class:"card"},h("h2",{},"The bouncer has a secret rule"),
   h("p",{class:"mute"},"Tap up to 4 words to test them. Each test is locked in and counts toward your score."),
   h("div",{class:"words"},set.words.map((x,j)=>{const tested=run.t[i].includes(j);
    return h("button",{class:"w"+(tested?(x.t?" in":" out"):""),disabled:tested||left<=0,"aria-label":x.w+(tested?(x.t?", tested, IN":", tested, OUT"):""),
     onclick:()=>{run.t[i].push(j);run.a[i][j]=x.t;V.say="Bouncer: "+x.w.toUpperCase()+" is "+(x.t?"IN ✓":"OUT ✕");saveRun(run);render()}},
     h("span",{},x.w),tested?h("small",{},x.t?IN:OUT):null)})),
   h("p",{class:"say",role:"status","aria-live":"polite"},V.say),
   h("button",{class:"primary","data-focus":"1",onclick:()=>{run.ph="sort";V.say="";saveRun(run);render()}},"Start sorting ("+(8-run.t[i].length)+" words left, "+left+" tests unused)"))}
 else if(run.ph=="sort"){
  const todo=set.words.map((x,j)=>j).filter(j=>run.a[i][j]===null),cur=todo[0],x=set.words[cur];
  const total=8-run.t[i].length,done=total-todo.length;
  body=h("div",{class:"card"},h("p",{class:"mute"},"Word "+(done+1)+" of "+total+". Answers lock once chosen."),
   h("div",{class:"big",role:"status","aria-live":"polite"},x.w),
   h("div",{class:"row ans"},
    h("button",{class:"bin",onclick:()=>pick(cur,true)},IN),h("button",{class:"bout",onclick:()=>pick(cur,false)},OUT)),
   run.t[i].length?h("p",{class:"tiny"},"Tested: "+run.t[i].map(j=>set.words[j].w+" "+(set.words[j].t?"IN":"OUT")).join(", ")):null)}
 else{
  const sc=scoreOf(run,i),last=i==n-1;
  body=h("div",{class:"card velvet"},h("p",{class:"tiny",style:"color:inherit;opacity:.8"},"The rule was"),h("h2",{},"It "+R.name),
   h("div",{class:"score"},sc+"/8 words, "+run.t[i].length+" tests"),
   h("ul",{class:"list"},set.words.map((w,j)=>{const t=run.t[i].includes(j),ok=run.a[i][j]===w.t;
    return h("li",{},h("strong",{},w.w),h("span",{},(w.t?"fits ✓":"does not fit ✕")+" · "+(t?"tested":ok?"you were right":"you were wrong")))})),
   h("p",{},"Fun fact: "+R.fact),
   h("button",{class:"primary","data-focus":"1",onclick:next},run.mode=="free"?"Next rule":last?"See results":"Next rule"))}
 return h("div",{style:"display:flex;flex-direction:column;gap:14px"},top,note,body)}
function pick(j,v){const run=V.run;run.a[run.ri][j]=v;
 if(run.a[run.ri].every(x=>x!==null))run.ph="reveal";saveRun(run);render()}
function next(){const run=V.run;V.say="";
 if(run.mode=="free"){V.free.played++;V.run=null;return startFree()}
 run.ri++;run.ph="test";saveRun(run);
 if(isDone(run)){
  if(run.mode=="daily")finishDaily(run.date);
  if(run.mode=="cmp"){V.cmp={date:run.date,run,code:V.pending};V.run=null;V.pending=null}
 }render()}
/* --- results, share, compare --- */
function copyBtn(ta,status){
 return h("button",{onclick:async()=>{try{await navigator.clipboard.writeText(ta.value);status.textContent="Copied."}
  catch(e){ta.focus();ta.select();status.textContent="Copy was blocked. The text is selected, press and hold to copy."}}},"Copy results")}
function resultsCard(run){
 const text=shareText(run.date,run),ta=h("textarea",{class:"share",readonly:true,id:"sharebox","aria-label":"Share text"});ta.value=text;
 const st=h("p",{class:"tiny",role:"status"},"");
 const tot=run.sets.reduce((n,_,i)=>n+scoreOf(run,i),0),tests=run.t.reduce((n,x)=>n+x.length,0);
 return h("div",{class:"card"},h("h2",{},"Tonight's door is closed"),
  h("div",{class:"score"},tot+"/16 words, "+tests+" tests"),
  run.sets.map((s,i)=>h("p",{},"Rule "+(i+1)+": it "+RULES[s.ri].name+" ("+scoreOf(run,i)+"/8, "+run.t[i].length+" tests)")),
  ta,h("div",{class:"row"},copyBtn(ta,st)),st)}
function compareBox(){
 const inp=h("input",{type:"text",id:"cmpcode",placeholder:"2026-10-18-1011001100110011","aria-label":"Friend's code",autocomplete:"off",autocapitalize:"off",spellcheck:"false"}),
  msg=h("p",{class:"tiny",role:"status"},"");
 const go=()=>{const c=parseCode(inp.value);if(!c){msg.textContent="That code is not valid. It looks like 2026-10-18-1011001100110011.";return}startCompare(c,msg)};
 inp.addEventListener("keydown",e=>{if(e.key=="Enter")go()});
 return h("div",{class:"card"},h("h2",{},"Compare with a friend"),h("p",{class:"mute"},"Paste a friend's code or their whole share text. You play their day's set, then see how your answers match."),
  inp,h("button",{onclick:go},"Play and compare"),msg)}
function startCompare(c,msg){
 const t=today();V.tab="daily";
 if(c.date>t){if(msg)msg.textContent="That code is from a future day.";return}
 if(c.date==t){const d=loadDaily(t);
  if(isDone(d)){V.cmp={date:t,run:d,code:c};V.run=null;return render()}
  V.pending=c;V.run=d;return render()}
 V.pending=c;V.run=newRun("cmp",c.date,makeSet(c.date));render()}
function cmpBody(date,run,code){
 const f=code.ans.split("").map(x=>x=="1");let same=0,fr=0,me=0;const secs=[];
 run.sets.forEach((s,i)=>{secs.push(h("h2",{},"Rule "+(i+1)+": it "+RULES[s.ri].name),
  h("ul",{class:"list"},s.words.map((w,j)=>{const mine=run.a[i][j],fa=f[i*8+j],eq=mine===fa;if(eq)same++;if(mine===w.t)me++;if(fa===w.t)fr++;
   const l=(v)=>(v?"IN":"OUT")+(v===w.t?" ✓":" ✕");
   return h("li",{},h("strong",{},w.w),h("span",{},"You: "+l(mine)+" · Friend: "+l(fa)+" · "+(eq?"Same":"Different")))})))});
 return h("div",{class:"card"},h("h2",{},"You agree on "+same+" of 16 words"),
  h("p",{class:"mute"},"Set for "+date+". You got "+me+"/16 right and your friend got "+fr+"/16 right."),secs)}
function cmpView(){const c=V.cmp;
 return h("div",{style:"display:flex;flex-direction:column;gap:14px"},cmpBody(c.date,c.run,c.code),
  h("button",{class:"primary","data-focus":"1",onclick:()=>{V.cmp=null;render()}},"Back"))}
/* --- daily home --- */
function cdText(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.max(0,Math.floor((m-n)/1000));
 return p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)}
function homeView(){
 V.stale=false;const t=V.day=today(),run=loadDaily(t),done=isDone(run),sk=streakNow(),started=run.t.some(x=>x.length)||run.a.some(x=>x.some(v=>v!==null));
 const streak=h("p",{class:"bar"},h("span",{},"Streak: "+sk+(sk==1?" day":" days")),h("span",{},t));
 const parts=[streak];
 if(!done){parts.push(h("div",{class:"card velvet"},h("h2",{},"Tonight's door"),
  h("p",{},"Two secret rules. Eight words each. Test up to 4 words, then sort the rest into IN or OUT. Fewer tests is a better score."),
  h("button",{class:"primary","data-focus":"1",onclick:()=>{V.run=run;render()}},started?"Continue tonight's set":"Open the door")))}
 else{parts.push(resultsCard(run),h("div",{class:"card"},h("h2",{},"Come back tomorrow"),h("p",{class:"mute"},"Your next set opens in"),
  h("div",{class:"score",id:"cd","aria-live":"off"},cdText())));
  if(V.pending&&V.pending.date==t){parts.push(cmpBody(t,run,V.pending))}}
 parts.push(compareBox());
 return h("div",{style:"display:flex;flex-direction:column;gap:14px"},parts)}
/* --- unlimited --- */
function startFree(){const F=V.free;
 if(F.pos>=F.deck.length){F.deck=shuf(RULES.map((_,i)=>i),rng("deck|"+Math.random()));F.pos=0;F.round++}
 V.run=newRun("free","",makeOne(F.deck[F.pos++]));render()}
function freeView(){const F=V.free;
 if(V.run&&V.run.mode=="free"&&!isDone(V.run))return playView();
 return h("div",{class:"card velvet"},h("h2",{},"Unlimited"),
  h("p",{},"One rule at a time, as many as you like. This never changes your streak or your daily results."),
  h("p",{},"Rules played this session: "+F.played+(F.round?" · Round "+F.round+" of the "+RULES.length+" rule deck":"")),
  h("button",{class:"primary","data-focus":"1",onclick:startFree},F.played?"Next rule":"Start"))}
/* ===== BOOT ===== */
function boot(){
 const q=(()=>{try{return new URLSearchParams(location.search).get("c")}catch(e){return null}})();
 const c=q&&parseCode(q);
 if(c)startCompare(c);else render();
 setInterval(()=>{const t=today();
  if(t!=V.day){const playing=V.run&&!isDone(V.run);
   if(playing)V.stale=true;else{V.day=t;V.stale=false;V.pending=null;render()}}
  const cd=document.getElementById("cd");if(cd)cd.textContent=cdText()},1000)}
if(typeof document!="undefined")boot();
</script>
