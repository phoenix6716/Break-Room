<title>Inner Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

:root[data-theme="dark"]{--bg:#0F1613;--card:#17201C;--fg:#E8EDE6;--mut:#9BA89F;--line:#2C3832;--acc:#E6B450;--on:#10160F;--g:#6FD083;--c:#E8C547;--o:#F29B4B;--m:#FF7D74;color-scheme:dark}

[hidden]{display:none!important}
html{height:100%}
body{min-height:100%;margin:0 auto;max-width:30rem;display:flex;flex-direction:column;gap:12px;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{margin:0;font:600 1.5rem var(--disp);letter-spacing:.02em}
h2{margin:0;font:600 1.6rem/1.2 var(--disp);text-wrap:balance}
#streak{font:600 .8rem var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--fg);border-radius:10px;overflow:hidden}

#pips .cur{border-color:var(--fg);color:var(--fg)}

.b0{color:var(--g)}.b1{color:var(--c)}.b2{color:var(--o)}.b3{color:var(--m)}

<header><h1>Inner Clock</h1><span id="streak"></span></header>
<nav id="tabs" role="tablist" aria-label="Mode">

<main>
<section id="cin" hidden>
<h2>Beat a friend</h2>
<label for="code">Paste a friend's code</label>

<button class="btn" id="load" type="button">Play that day's set</button>
<p id="err" role="alert"></p>
<p class="note">You play the same five targets, then see each one side by side.</p>
</section>
<section id="play" hidden>
<p id="lab"></p>
<div id="pips"></div>
<div class="dial"><div id="big"></div><div id="sub"></div></div>
<p id="band" hidden></p>
<p id="fact" hidden></p>
<p id="msg" role="status" aria-live="polite"></p>
<button id="go" type="button"></button>
<p class="note">Phone taps add about 30 to 80 ms of delay, the same for every player.</p>
</section>
<section id="done" hidden>
<h2 id="dt"></h2>
<p id="ds" style="margin:0"></p>
<div class="tw"><table id="tb"></table></div>
<p class="note">G gold hit ★, C close ●, O off ▲, M miss ✕. Minus means early, plus means late.</p>
<div id="shr" hidden>
<label for="sx">Share text, no spoilers</label>
<textarea id="sx" rows="6" readonly></textarea>
<button class="btn" id="cp" type="button">Copy</button>
<p id="cm" role="status"></p>
</div>
<p id="cd" style="margin:0;font-weight:600"></p>
<button class="btn" id="again" type="button" hidden>Compare another code</button>
</section>

<script>
"use strict";
let today = dk(), mode = "daily", hold = 0, lastPtr = 0;
const ses = { daily: null, unl: null, cmp: null };
const mk = (m, key, tg, res = []) => ({ mode: m, key, targets: tg, res, i: res.length, ph: m !== "unl" && res.length >= 5 ? "done" : "idle", note: "", fact: "", t0: 0, their: null });

/* MONETISATION HOOK (archive of past days): call loadDaily(pastKey) from a date list and store results under ic.arch.<date>. */
function loadDaily() {
  const v = ld("ic.day", {});
  let m = [];
  if (v && v.d === today && Array.isArray(v.m)) m = v.m.filter(Number.isFinite).slice(0, 5);
  return mk("daily", today, targets(today), m);
}
/* MONETISATION HOOK (streak freezes): in bump(), a spent freeze token could keep the streak when one day was missed. */
function bump(key) {
  const s = ld("ic.streak", {});
  if (s.last === key) return;
  sv("ic.streak", { last: key, n: s.last === yest(key) ? (+s.n || 0) + 1 : 1 });
}
function streak() {
  const s = ld("ic.streak", {});
  return s.last === today || s.last === yest(today) ? (+s.n || 0) : 0;
}

/* Compare codes look like 2026-10-18-+12,-45,+8,+130,-7 (five signed misses in centiseconds). */
const RX = /(\d{4})-(\d{2})-(\d{2})-([+-]\d{1,4}(?:,[+-]\d{1,4}){4})/;
function parse(s) {
  s = String(s || "");
  try { s = decodeURIComponent(s); } catch (e) { }
  const m = RX.exec(s.replace(/ /g, "+"));
  if (!m) return null;
  const key = m[1] + "-" + m[2] + "-" + m[3], d = new Date(+m[1], +m[2] - 1, +m[3]);
  if (dk(d) !== key || key > today || +m[1] < 2024) return null;
  return { key, a: m[4].split(",").map(Number) };
}
function loadCode(v) {
  const p = parse(v);
  if (!p) return fail("That is not a valid code. It should look like 2026-10-18-+12,-45,+8,+130,-7.");
  const tg = targets(p.key);
  if (p.a.some((c, i) => c < -Math.round(tg[i] * 100))) return fail("This code does not match that day's set.");

}
function fail(t) { $("err").textContent = t; }

function lose() {

}
function stop(S, now) {
  const t = S.targets[S.i], cs = Math.round(((now - S.t0) / 1000 - t) * 100);

function next(S) {
  S.i++; S.note = "";

}
function act() {
  const S = ses[mode], now = performance.now();
  if (!S || S.ph === "done" || now < hold) return;

function table(head, rows) {

  head.forEach(h => tr.appendChild(el("th", h)));
  t.appendChild(el("thead")).appendChild(tr);
  const tb = t.appendChild(el("tbody"));
  rows.forEach(r => { const x = el("tr"); r.forEach(c => x.appendChild(el("td", c))); tb.appendChild(x); });
}

function shareText(S) {

  $("shr").hidden = cmp; $("cd").hidden = cmp; $("again").hidden = !cmp;

    let w = 0, l = 0, e = 0;
    const rows = tg.map((t, i) => {
      const a = Math.abs(S.res[i]), b = Math.abs(S.their[i]), r = a < b ? "You" : a > b ? "Friend" : "Tie";
      r === "You" ? w++ : r === "Friend" ? l++ : e++;
      return [i + 1, t.toFixed(1) + " s", cell(S.res[i]), cell(S.their[i]), r];
    });
    $("dt").textContent = "You won " + w + " of 5 targets";
    $("ds").textContent = "Friend won " + l + (e ? ", tied " + e : "") + ". Average miss: you " + avg(S.res) + " s, friend " + avg(S.their) + " s. Set of " + S.key + ".";
    table(["#", "Target", "You", "Friend", "Winner"], rows);
    return;
  }
  $("dt").textContent = "Today is done";
  $("ds").textContent = "Average miss " + avg(S.res) + " s. Streak " + streak() + (streak() === 1 ? " day." : " days.");
  table(["#", "Target", "Miss"], tg.map((t, i) => [i + 1, t.toFixed(1) + " s", cell(S.res[i])]));
  $("sx").value = shareText(S);
  tickCd();
}
function renderPlay(S) {
  const t = S.targets[S.i], lock = S.ph === "lock", unl = S.mode === "unl", cs = S.res[S.i];
  $("lab").textContent = unl ? "Unlimited. Played " + S.res.length + (S.res.length ? ". Average miss " + avg(S.res) + " s" : "")
    : (S.mode === "cmp" ? "Friend's set " + S.key + ". " : "") + "Target " + (S.i + 1) + " of 5";
  const p = $("pips"); p.hidden = unl; p.textContent = "";
  if (!unl) for (let i = 0; i < 5; i++) {
    const d = S.res[i] !== undefined && (i < S.i || lock), b = d ? band(S.res[i]) : -1;
    const sp = el("span", d ? B[b].s : i + 1, d ? "b" + b : i === S.i ? "cur" : "");
    sp.setAttribute("aria-label", "Target " + (i + 1) + (d ? ": " + B[b].n : ""));
    p.appendChild(sp);
  }
  $("big").textContent = lock ? (Math.abs(cs) / 100).toFixed(2) : t.toFixed(1);
  $("sub").textContent = lock ? (cs === 0 ? "seconds, dead on" : "seconds " + (cs < 0 ? "early" : "late")) : S.ph === "run" ? "timing" : "second target";
  const bd = $("band"), ft = $("fact");
  bd.hidden = ft.hidden = !lock;
  if (lock) { const b = band(cs); bd.textContent = B[b].s + " " + B[b].n; bd.className = "b" + b; ft.textContent = S.fact; }
  $("msg").textContent = S.note || (S.ph === "idle" ? "Tap Start, then tap Stop when you think " + t.toFixed(1) + " s have passed." : S.ph === "run" ? "Nothing is counting. Trust your inner clock." : "");
  const g = $("go");
  g.dataset.s = S.ph;
  g.textContent = S.ph === "idle" ? "Start" : S.ph === "run" ? "Stop" : !unl && S.i >= 4 ? "See results" : "Next target";
}
function render() {
  const S = ses[mode], done = S && S.ph === "done";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.m === mode));
  $("cin").hidden = !(mode === "cmp" && !S);
  $("play").hidden = !S || done;
  $("done").hidden = !done;
  tickStreak();
  if (S) done ? renderDone(S) : renderPlay(S);
}
function tickStreak() { const s = streak(); $("streak").textContent = "Streak " + s + (s === 1 ? " day" : " days"); }
function tickCd() {
  const S = ses.daily, nw = new Date(), ms = new Date(nw.getFullYear(), nw.getMonth(), nw.getDate() + 1) - nw, s = Math.max(0, Math.floor(ms / 1000));
  $("cd").textContent = "Next set in " + pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60) + ". Come back tomorrow.";
}
/* Handles the date rolling over at midnight while the page is open. */
function tick() {
  const t = dk();
  if (t !== today) { today = t; ses.daily = loadDaily(); render(); return; }
  if (mode === "daily" && ses.daily.ph === "done") tickCd();
}

ses.daily = loadDaily();
ses.unl = mk("unl", null, [rt()]);
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { lose(); mode = b.dataset.m; render(); });
const go = $("go");
go.addEventListener("pointerdown", e => { e.preventDefault(); lastPtr = performance.now(); act(); });

$("load").onclick = () => loadCode($("code").value);
